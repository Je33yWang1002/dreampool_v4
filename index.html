<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院</title>
    <meta property="og:title" content="🎬 潛意識電影院">
    <meta property="og:description" content="說出你的夢境，AI 幫你拍成電影">
    <meta property="og:image" content="https://dreampool-v4.vercel.app/og-cover.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #070b14;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px 60px;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        /* ── 標題區 ── */
        .hero {
            text-align: center;
            margin-bottom: 32px;
        }
        .hero h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4757, #ff6b35, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .hero p { color: #6b7280; font-size: 15px; }

        /* ── 卡片 ── */
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 20px;
        }

        /* ── 輸入區 ── */
        .input-label {
            font-size: 13px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0d1117;
            border: 1.5px solid #21262d;
            border-radius: 10px;
            color: #e2e8f0;
            padding: 14px;
            font-size: 15px;
            resize: vertical;
            line-height: 1.6;
            transition: border-color 0.2s;
        }
        textarea:focus { outline: none; border-color: #ff4757; }

        /* ── 語音按鈕區 ── */
        .voice-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-voice {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1f2937;
            border: 1.5px solid #374151;
            color: #d1d5db;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-voice:hover { border-color: #ff4757; color: #ff4757; }
        .btn-voice.recording {
            background: rgba(255,71,87,0.12);
            border-color: #ff4757;
            color: #ff4757;
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.3); }
            50% { box-shadow: 0 0 0 6px rgba(255,71,87,0); }
        }

        .mic-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ff4757;
            display: none;
            animation: blink 1s ease-in-out infinite;
        }
        .btn-voice.recording .mic-dot { display: block; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

        .voice-hint { font-size: 12px; color: #4b5563; }

        /* ── 主按鈕 ── */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff4757, #c0392b);
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,71,87,0.35);
        }
        .btn-submit:disabled { background: #1f2937; color: #4b5563; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ── 進度狀態 ── */
        .status-bar {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: #0d1117;
            border: 1px solid #1f2937;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 14px;
            color: #9ca3af;
        }
        .spinner {
            width: 18px; height: 18px; flex-shrink: 0;
            border: 2.5px solid #1f2937;
            border-top-color: #ff4757;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── 結果區 ── */
        .result-card { display: none; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }

        .tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .tag {
            background: rgba(99,102,241,0.1);
            color: #818cf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(99,102,241,0.25);
        }

        .prompt-box {
            background: #0d1117;
            border: 1px solid #21262d;
            padding: 14px 16px;
            border-radius: 10px;
            color: #4ade80;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.7;
            word-break: break-word;
            margin-bottom: 20px;
        }

        .divider { border: none; border-top: 1px solid #1f2937; margin: 20px 0; }

        /* ── 影片區 ── */
        .video-section { display: none; }

        .success-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(74,222,128,0.08);
            border: 1px solid rgba(74,222,128,0.25);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        /* 16:9 影片容器 */
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(255,71,87,0.5);
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 40px rgba(255,71,87,0.15);
        }
        .video-wrapper video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        /* ── 操作按鈕列 ── */
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border: none;
        }
        .btn-download {
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.3);
            color: #4ade80;
        }
        .btn-download:hover { background: rgba(74,222,128,0.2); }

        .btn-share {
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.3);
            color: #818cf8;
        }
        .btn-share:hover { background: rgba(99,102,241,0.2); }

        .btn-copy {
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
        }
        .btn-copy:hover { background: rgba(251,191,36,0.2); }

        /* ── 分享提示 ── */
        .share-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1f2937;
            border: 1px solid #374151;
            color: #f9fafb;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 999;
            white-space: nowrap;
        }
        .share-toast.show { transform: translateX(-50%) translateY(0); }

        /* ── 渲染中提示 ── */
        .generating-msg {
            text-align: center;
            padding: 20px;
            color: #4b5563;
            font-size: 14px;
        }

        /* ── 品質徽章 ── */
        .quality-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.2);
            color: #fbbf24;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 標題 -->
    <div class="hero">
        <h1>🎬 潛意識電影院</h1>
        <p>說出你昨晚的夢境，AI 幫你拍成電影</p>
    </div>

    <!-- 輸入卡片 -->
    <div class="card">
        <div class="input-label">🔮 描述你的夢境</div>
        <textarea id="dreamInput" placeholder="例如：我夢見自己在螢光色的深海森林裡飛翔，身旁有一隻巨大的藍色發光水母緩慢游過..."></textarea>

        <!-- 語音輸入按鈕 -->
        <div class="voice-row">
            <button class="btn-voice" id="voiceBtn" onclick="toggleRecording()">
                <span>🎙️</span>
                <span id="voiceBtnText">語音輸入</span>
                <div class="mic-dot"></div>
            </button>
            <span class="voice-hint" id="voiceHint">按下按鈕，說出你的夢境</span>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="startDreamProcess()">
            開始具現化夢境 🚀
            <span class="quality-badge">✨ v2.1 Pro</span>
        </button>

        <!-- 狀態列 -->
        <div class="status-bar" id="statusBar">
            <div class="spinner"></div>
            <span id="statusText">正在連接夢境頻道...</span>
        </div>
    </div>

    <!-- 結果卡片 -->
    <div class="card result-card" id="resultCard">
        <div class="section-label">✨ 潛意識標籤</div>
        <div class="tags-row" id="tagContainer"></div>

        <div class="section-label">📝 AI 導演劇本</div>
        <div class="prompt-box" id="promptContent"></div>

        <hr class="divider">

        <!-- 影片區 -->
        <div class="video-section" id="videoSection">
            <div class="success-badge">✅ 夢境影片生成完成</div>
            <div class="section-label">🎞️ 夢境電影現場放映</div>
            <div class="video-wrapper">
                <video id="dreamVideoPlayer" controls autoplay loop playsinline preload="auto"></video>
            </div>

            <!-- 操作按鈕 -->
            <div class="action-row">
                <button class="btn-action btn-download" id="downloadBtn" onclick="downloadVideo()">
                    ⬇️ 下載影片
                </button>
                <button class="btn-action btn-copy" onclick="copyLink()">
                    🔗 複製連結
                </button>
                <button class="btn-action btn-share" onclick="shareVideo()">
                    📤 分享
                </button>
            </div>
        </div>

        <!-- 渲染中 -->
        <div class="generating-msg" id="generatingMsg">
            ⏳ 夢境影片正在渲染中，請稍候...
        </div>
    </div>
</div>

<!-- Toast 提示 -->
<div class="share-toast" id="shareToast">✅ 連結已複製到剪貼簿！</div>

<script>
// ── 全域狀態 ──
let checkInterval = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let currentVideoUrl = '';

// ── 語音錄音 ──
async function toggleRecording() {
    if (isRecording) {
        stopRecording();
    } else {
        await startRecording();
    }
}

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

        mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            await sendAudioToWhisper();
        };

        mediaRecorder.start();
        isRecording = true;

        const btn = document.getElementById('voiceBtn');
        btn.classList.add('recording');
        document.getElementById('voiceBtnText').textContent = '錄音中... 點擊停止';
        document.getElementById('voiceHint').textContent = '正在錄音，說完夢境後點擊停止';

    } catch (err) {
        alert('無法使用麥克風，請允許瀏覽器麥克風權限。');
    }
}

function stopRecording() {
    if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        const btn = document.getElementById('voiceBtn');
        btn.classList.remove('recording');
        document.getElementById('voiceBtnText').textContent = '辨識中...';
        document.getElementById('voiceHint').textContent = '正在將語音轉換為文字...';
        btn.disabled = true;
    }
}

async function sendAudioToWhisper() {
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const formData = new FormData();
    formData.append('audio', blob, 'dream.webm');
    formData.append('mode', 'transcribe');

    try {
        const res = await fetch('/api/dream-process', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success && data.transcript) {
            document.getElementById('dreamInput').value = data.transcript;
            document.getElementById('voiceHint').textContent = '✅ 語音辨識完成！';
        } else {
            document.getElementById('voiceHint').textContent = '❌ 辨識失敗，請重試';
        }
    } catch(e) {
        document.getElementById('voiceHint').textContent = '❌ 連線錯誤，請重試';
    } finally {
        const btn = document.getElementById('voiceBtn');
        btn.disabled = false;
        document.getElementById('voiceBtnText').textContent = '語音輸入';
        setTimeout(() => {
            document.getElementById('voiceHint').textContent = '按下按鈕，說出你的夢境';
        }, 3000);
    }
}

// ── 主流程 ──
async function startDreamProcess() {
    const dreamText = document.getElementById('dreamInput').value.trim();
    if (!dreamText) { alert('請先輸入或說出你的夢境！'); return; }

    const submitBtn = document.getElementById('submitBtn');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    const resultCard = document.getElementById('resultCard');
    const videoSection = document.getElementById('videoSection');
    const generatingMsg = document.getElementById('generatingMsg');

    // 重置
    submitBtn.disabled = true;
    statusBar.style.display = 'flex';
    resultCard.style.display = 'none';
    videoSection.style.display = 'none';
    generatingMsg.style.display = 'block';
    document.getElementById('dreamVideoPlayer').src = '';
    currentVideoUrl = '';
    if (checkInterval) clearInterval(checkInterval);

    try {
        statusText.textContent = '🎨 正在傳送夢境給 AI 導演...';
        const formData = new FormData();
        formData.append('dream', dreamText);
        formData.append('mode', 'generate');

        const res = await fetch('/api/dream-process', { method: 'POST', body: formData });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || '發生未知錯誤');

        // 顯示標籤與 Prompt
        document.getElementById('promptContent').textContent = result.videoPrompt;
        const tagContainer = document.getElementById('tagContainer');
        tagContainer.innerHTML = '';
        (result.tags || []).forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = '#' + tag;
            tagContainer.appendChild(span);
        });
        resultCard.style.display = 'block';

        // 開始輪詢
        const taskId = result.taskId;
        statusText.textContent = '🎬 Kling v2.1 Pro 正在渲染高畫質影片（1-3 分鐘）...';

        checkInterval = setInterval(async () => {
            try {
                const checkForm = new FormData();
                checkForm.append('mode', 'check_status');
                checkForm.append('taskId', taskId);
                const checkRes = await fetch('/api/dream-process', { method: 'POST', body: checkForm });
                const checkData = await checkRes.json();
                if (!checkData.success) return;

                const status = (checkData.status || '').toLowerCase();

                if (status === 'succeed' || status === 'success') {
                    clearInterval(checkInterval);
                    statusBar.style.display = 'none';
                    currentVideoUrl = checkData.videoUrl;

                    const player = document.getElementById('dreamVideoPlayer');
                    player.src = currentVideoUrl;
                    player.load();
                    player.play().catch(() => {});

                    generatingMsg.style.display = 'none';
                    videoSection.style.display = 'block';
                    submitBtn.disabled = false;

                } else if (status === 'failed') {
                    clearInterval(checkInterval);
                    statusText.textContent = '❌ 影片生成失敗，請換個描述再試一次。';
                    submitBtn.disabled = false;

                } else {
                    const map = { processing: '🎥 渲染中', queued: '💤 排隊中', submitted: '📤 已提交' };
                    statusText.textContent = `⏳ ${map[status] || status}，請稍候...`;
                }
            } catch(e) { /* 繼續輪詢 */ }
        }, 5000);

    } catch(err) {
        alert('發生錯誤：' + err.message);
        statusBar.style.display = 'none';
        submitBtn.disabled = false;
    }
}

// ── 下載影片 ──
async function downloadVideo() {
    if (!currentVideoUrl) return;
    try {
        const res = await fetch(currentVideoUrl);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dream-${Date.now()}.mp4`;
        a.click();
        URL.revokeObjectURL(url);
    } catch(e) {
        // 若跨域無法直接下載，改為開新分頁
        window.open(currentVideoUrl, '_blank');
    }
}

// ── 複製連結 ──
function copyLink() {
    const shareUrl = currentVideoUrl || window.location.href;
    navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('✅ 連結已複製！可貼到 LINE / IG 分享');
    }).catch(() => {
        showToast('❌ 複製失敗，請手動複製網址');
    });
}

// ── 分享 ──
function shareVideo() {
    const shareData = {
        title: '🎬 我的潛意識電影',
        text: '用 AI 把我的夢境拍成電影了！',
        url: currentVideoUrl || window.location.href
    };
    if (navigator.share) {
        navigator.share(shareData).catch(() => copyLink());
    } else {
        copyLink();
    }
}

// ── Toast 提示 ──
function showToast(msg) {
    const toast = document.getElementById('shareToast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
</body>
</html>
